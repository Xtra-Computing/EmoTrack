# Selected paper configuration; use emotrack-reproduce for the full pipeline.
num_aida_features: 23
aida_groups:
- 8
- 5
- 10
d_model: 64
nhead: 4
dim_feedforward: 256
num_encoder_layers: 3
num_decoder_layers: 4
dropout: 0.1
scalar_mlp_hidden: 32
use_feature_identity: true
backbone_embed_dim: 4096
max_sentences: 80
num_items: 8
head_type: sigmoid
prev_sent_mode: summary_retrieval
ps_num_slots: 16
num_epochs: 80
batch_size: 32
lr: 0.001
weight_decay: 0.01
warmup_ratio: 0.05
max_grad_norm: 1.0
patience: 12
ordinal_nll_weight: 1.0
total_huber_weight: 0.05
aida_cache_path: out/eval/daic_woz/daic_features/aida/seed0/feature_cache/aida_features.json
embed_cache_dir: out/embed_cache/daic
dataset_path: out/datasets/daic.jsonl
split_file: result/daic_woz/train_val_test_split.json
split_by: run_id
eval_split: 0.2
seed: 42
deterministic_training: true
daic_oversample: 1
output_dir: out/emotrack_daic
result_name: emotrack_daic
history_dropout: 0.1
item_loss_weight: 0.0
fn_loss_weight: 0.0
fn_threshold: 10.0
